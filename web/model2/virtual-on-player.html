<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual-On</title><style>
html,body{margin:0;height:100%;background:#000;color:#dce8f5;font:14px system-ui;overflow:hidden}body{display:flex;flex-direction:column}
#display{position:relative;flex:1;min-height:0}canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);outline:none}
.game-actions{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:2;display:flex;gap:4px;opacity:0;pointer-events:none;transition:opacity .2s ease}
.game-actions button{display:grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid transparent;border-radius:5px;background:transparent;color:#fff;cursor:pointer;pointer-events:none;touch-action:manipulation}
.game-actions.is-visible,.game-actions:focus-within{opacity:1}
.game-actions.is-visible button,.game-actions:focus-within button{pointer-events:auto}
@media(hover:hover){.game-actions:hover{opacity:1}.game-actions:hover button{pointer-events:auto}.game-actions button:not(:disabled):hover{background:#006d73e8;border-color:#8cf3eb}.game-actions #quitGame:not(:disabled):hover{background:#9d2538e8;border-color:#ffa0ae}}
@media(prefers-reduced-motion:reduce){.game-actions{transition:none}}
.game-actions button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.game-actions button:disabled{opacity:.5;cursor:default}
.game-actions svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px #000c);pointer-events:none}
.renderer-notice{position:absolute;top:max(52px,calc(env(safe-area-inset-top) + 48px));left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:flex-start;gap:8px;box-sizing:border-box;width:min(560px,calc(100% - 32px));padding:12px 8px 12px 16px;border:1px solid #a77b31;border-radius:8px;background:#211c10f2;color:#fff0c9;box-shadow:0 4px 20px #0006;line-height:1.5}
.renderer-notice p{flex:1;margin:0}
.renderer-notice button{flex:none;width:36px;height:36px;margin:-4px 0;padding:0;border:0;border-radius:4px;background:transparent;color:inherit;font:24px system-ui;cursor:pointer;touch-action:manipulation}
.renderer-notice button:hover{background:#ffffff1a}.renderer-notice button:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
</style></head><body>
<div id="display">
  <div id="rendererNotice" class="renderer-notice" role="status" hidden>
    <p><strong>WebGPU is unavailable. Using WebGL 2.</strong><br>WebGL 2 support is still in development. You may experience slower performance or graphical issues.</p>
    <button id="dismissRendererNotice" type="button" aria-label="Dismiss WebGL 2 notice">×</button>
  </div>
  <div class="game-actions" role="group" aria-label="Game actions">
    <button id="quitGame" type="button" aria-label="Quit game" title="Quit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <button id="toggleFullscreen" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
  </div>
  <canvas id="screen" tabindex="0" aria-label="Virtual-On game"></canvas>
</div>
<script type="module" src="virtual-on-player.js"></script></body></html>
